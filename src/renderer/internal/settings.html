<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings</title>
  <link rel="stylesheet" href="/assets/base.css">
</head>
<body>
  <div class="page">
    <header class="page-head">
      <h1>Settings</h1>
      <p class="lede">Search, appearance, privacy and startup behaviour.</p>
    </header>

    <h2>Search</h2>
    <div class="card" id="search-settings"></div>

    <h2>Appearance</h2>
    <div class="card" id="appearance-settings"></div>

    <h2>Privacy</h2>
    <div class="card" id="privacy-settings"></div>
    <div class="card">
      <h3>Clear browsing data</h3>
      <p class="muted">Private-mode browsing is discarded automatically when you switch the mode off; this clears normal browsing.</p>
      <div id="clear-options"></div>
      <button id="clear" class="danger" style="margin-top: 12px;">Clear selected</button>
      <span class="muted" id="clear-status" style="margin-left: 10px;"></span>
    </div>

    <h2>Startup</h2>
    <div class="card" id="startup-settings"></div>

    <h2>About</h2>
    <div class="card" id="about"></div>
  </div>

  <script type="module" src="/assets/settings.js"></script>
</body>
</html>
