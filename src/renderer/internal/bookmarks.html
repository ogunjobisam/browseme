<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bookmarks</title>
  <link rel="stylesheet" href="/assets/base.css">
</head>
<body>
  <div class="page">
    <header class="page-head">
      <h1>Bookmarks</h1>
      <p class="lede">Saved with the star in the address bar, or Ctrl+D.</p>
    </header>

    <div class="toolbar-row">
      <input id="search" class="grow" type="search" placeholder="Search bookmarks" autocomplete="off">
      <span class="muted" id="count"></span>
    </div>

    <div class="card" id="list"></div>
  </div>

  <script type="module" src="/assets/bookmarks.js"></script>
</body>
</html>
